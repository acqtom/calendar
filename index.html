<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kill calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="brandbar">
    <a class="logo" href="https://paidcoaching.com" target="_blank" rel="noopener" aria-label="Paidcoaching.com">
      <img src="logo.png" alt="" width="36" height="35">
      <span>Paidcoaching.com</span>
    </a>
  </header>

  <div class="app">
    <header class="topbar">
      <div class="nav">
        <button class="icon-btn" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button class="btn ghost sm" id="todayBtn">Today</button>
        <button class="icon-btn" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <h1 id="rangeTitle"></h1>
      </div>

      <div class="top-right">
        <div class="tz-pick" id="tzPick">
          <button type="button" class="tz-btn" id="tzBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="tzPop" title="Timezone">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
            <span id="tzLabel"></span>
          </button>
          <div class="tz-pop" id="tzPop" hidden>
            <input id="tzSearch" type="search" placeholder="Search city, region or GMT+4…" autocomplete="off" spellcheck="false"
                   role="combobox" aria-expanded="true" aria-controls="tzList" aria-autocomplete="list" aria-label="Search timezones">
            <ul id="tzList" role="listbox" aria-label="Timezones"></ul>
          </div>
        </div>
        <div class="seg" role="tablist" aria-label="View">
          <button role="tab" data-view="day">Day</button>
          <button role="tab" data-view="week">Week</button>
          <button role="tab" data-view="month">Month</button>
        </div>
        <button class="btn primary" id="newBtn">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>New task</span>
        </button>
      </div>
    </header>

    <div class="layout">

      <main class="main card" id="view"></main>

      <aside class="sidebar">
        <!-- Mini calendar -->
        <section class="card mini">
          <div class="mini-head">
            <h2 id="miniTitle"></h2>
            <div class="mini-nav">
              <button class="icon-btn xs" id="miniPrev" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
              <button class="icon-btn xs" id="miniNext" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
            </div>
          </div>
          <div class="mini-grid" id="miniGrid"></div>
        </section>

        <section class="card agenda" id="agenda" hidden></section>
      </aside>
    </div>
  </div>

  <!-- Task editor -->
  <dialog id="editor" class="sheet">
    <form id="editorForm" autocomplete="off">
      <div class="sheet-head">
        <h2 id="editorTitle">New task</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>

      <label class="field">
        <span>Title</span>
        <input id="fTitle" placeholder="What's happening?" maxlength="120" required>
      </label>

      <div class="row3">
        <label class="field"><span id="fDateLabel">Date</span><input type="date" id="fDate" required></label>
        <label class="field"><span>Start</span><input type="time" id="fStart" required></label>
        <label class="field"><span>End</span><input type="time" id="fEnd" required></label>
      </div>

      <div class="field">
        <span>Repeat</span>
        <div class="select-wrap">
          <select id="fRepeat" aria-label="Repeat">
            <option value="none">Does not repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="custom">Custom…</option>
          </select>
        </div>
        <div class="rep-panel" id="fCustom" hidden>
          <div class="rep-line">
            <span>Every</span>
            <input type="number" id="fInterval" min="1" max="99" value="1" inputmode="numeric" aria-label="Repeat every">
            <div class="select-wrap">
              <select id="fFreq" aria-label="Repeat unit">
                <option value="daily">day</option>
                <option value="weekly">week</option>
                <option value="monthly">month</option>
              </select>
            </div>
          </div>
          <div class="day-pills" id="fDays" role="group" aria-label="Repeat on"></div>
        </div>
        <div class="rep-line" id="fEndsRow" hidden>
          <span>Ends</span>
          <div class="select-wrap">
            <select id="fEnds" aria-label="Ends">
              <option value="never">Never</option>
              <option value="on">On date</option>
            </select>
          </div>
          <input type="date" id="fUntil" aria-label="End date" hidden>
        </div>
      </div>

      <div class="field">
        <span>Category</span>
        <div class="opt-grid" id="fCats"></div>
      </div>

      <div class="field">
        <span>Checklist <em class="sub-note" id="fSubsNote" hidden></em></span>
        <ul class="checklist" id="fSubs"></ul>
        <div class="add-row">
          <input id="fSubInput" placeholder="Add a step…" maxlength="200">
          <button type="button" class="icon-btn" id="fSubAdd" aria-label="Add step"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>

      <label class="field">
        <span>Notes</span>
        <textarea id="fNotes" rows="2" maxlength="2000" placeholder="Optional"></textarea>
      </label>

      <p class="tz-note"><span class="dot-live"></span>Times in <strong id="fTz"></strong></p>

      <div class="sheet-foot">
        <button type="button" class="btn danger" id="fDeleteOne" hidden>Delete this one</button>
        <button type="button" class="btn danger" id="fDelete">Delete</button>
        <button type="submit" class="btn primary wide">Save <span aria-hidden="true">→</span></button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
