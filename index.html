<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kill calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="brandbar">
    <a class="logo" href="https://paidcoaching.com" target="_blank" rel="noopener" aria-label="Paidcoaching.com">
      <img src="logo.png" alt="" width="36" height="35">
      <span>Paidcoaching.com</span>
    </a>
  </header>

  <div class="app">
    <header class="topbar">
      <div class="nav">
        <button class="icon-btn" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button class="btn ghost sm" id="todayBtn">Today</button>
        <button class="icon-btn" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <h1 id="rangeTitle"></h1>
      </div>

      <div class="top-right">
        <button type="button" class="tz-btn clocks-btn kill-btn" id="killBtn" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
          <span>Kill list</span>
          <b class="kill-count" id="killCount" hidden></b>
        </button>
        <button type="button" class="tz-btn clocks-btn" id="clocksBtn" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Time zones</span>
        </button>
        <div class="tz-pick" id="tzPick">
          <button type="button" class="tz-btn" id="tzBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="tzPop" title="Timezone">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
            <span id="tzLabel"></span>
          </button>
          <div class="tz-pop" id="tzPop" hidden>
            <input id="tzSearch" type="search" placeholder="Search city, region or GMT+4…" autocomplete="off" spellcheck="false"
                   role="combobox" aria-expanded="true" aria-controls="tzList" aria-autocomplete="list" aria-label="Search timezones">
            <ul id="tzList" role="listbox" aria-label="Timezones"></ul>
          </div>
        </div>
        <div class="seg" role="tablist" aria-label="View">
          <button role="tab" data-view="day">Day</button>
          <button role="tab" data-view="week">Week</button>
          <button role="tab" data-view="month">Month</button>
        </div>
        <button class="btn primary" id="newBtn">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>New task</span>
        </button>
      </div>
    </header>

    <div class="layout">

      <main class="main card" id="view"></main>

      <aside class="sidebar">
        <!-- Mini calendar -->
        <section class="card mini">
          <div class="mini-head">
            <h2 id="miniTitle"></h2>
            <div class="mini-nav">
              <button class="icon-btn xs" id="miniPrev" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
              <button class="icon-btn xs" id="miniNext" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
            </div>
          </div>
          <div class="mini-grid" id="miniGrid"></div>
        </section>

        <section class="card agenda" id="agenda" hidden></section>
      </aside>
    </div>
  </div>

  <!-- Task editor -->
  <dialog id="editor" class="sheet">
    <form id="editorForm" autocomplete="off">
      <div class="sheet-head">
        <h2 id="editorTitle">New task</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>

      <label class="field">
        <span>Title</span>
        <input id="fTitle" placeholder="What's happening?" maxlength="120" required>
      </label>

      <div class="row3">
        <label class="field"><span id="fDateLabel">Date</span><input type="date" id="fDate" required></label>
        <label class="field"><span>Start</span><input type="time" id="fStart" required></label>
        <label class="field"><span>End</span><input type="time" id="fEnd" required></label>
      </div>

      <div class="field" id="fZonesField" hidden>
        <span>In your other time zones</span>
        <ul class="zone-times" id="fZones"></ul>
      </div>

      <div class="field">
        <span>Repeat</span>
        <div class="select-wrap">
          <select id="fRepeat" aria-label="Repeat">
            <option value="none">Does not repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="custom">Custom…</option>
          </select>
        </div>
        <div class="rep-panel" id="fCustom" hidden>
          <div class="rep-line">
            <span>Every</span>
            <input type="number" id="fInterval" min="1" max="99" value="1" inputmode="numeric" aria-label="Repeat every">
            <div class="select-wrap">
              <select id="fFreq" aria-label="Repeat unit">
                <option value="daily">day</option>
                <option value="weekly">week</option>
                <option value="monthly">month</option>
              </select>
            </div>
          </div>
          <div class="day-pills" id="fDays" role="group" aria-label="Repeat on"></div>
        </div>
        <div class="rep-line" id="fEndsRow" hidden>
          <span>Ends</span>
          <div class="select-wrap">
            <select id="fEnds" aria-label="Ends">
              <option value="never">Never</option>
              <option value="on">On date</option>
            </select>
          </div>
          <input type="date" id="fUntil" aria-label="End date" hidden>
        </div>
      </div>

      <div class="field">
        <span>Category</span>
        <div class="opt-grid" id="fCats"></div>
        <div class="cat-new" id="catNew" hidden>
          <input id="catName" placeholder="Category name, e.g. Gym" maxlength="30" aria-label="New category name">
          <div class="cat-pick-row"><span>Colour</span><div class="swatches" id="catColors" role="radiogroup" aria-label="Colour"></div></div>
          <div class="cat-pick-row"><span>Icon</span><div class="icon-picks" id="catIcons" role="radiogroup" aria-label="Icon"></div></div>
          <div class="cat-new-foot">
            <button type="button" class="btn sm" id="catCancel">Cancel</button>
            <button type="button" class="btn sm primary" id="catSave">Add category</button>
          </div>
        </div>
      </div>

      <div class="field">
        <span>Checklist <em class="sub-note" id="fSubsNote" hidden></em></span>
        <ul class="checklist" id="fSubs"></ul>
        <div class="add-row">
          <input id="fSubInput" placeholder="Add a step…" maxlength="200">
          <button type="button" class="icon-btn" id="fSubAdd" aria-label="Add step"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>

      <label class="field">
        <span>Notes</span>
        <textarea id="fNotes" rows="2" maxlength="2000" placeholder="Optional"></textarea>
      </label>

      <p class="tz-note"><span class="dot-live"></span>Times in <strong id="fTz"></strong></p>

      <div class="sheet-foot">
        <button type="button" class="btn danger" id="fDeleteOne" hidden>Delete this one</button>
        <button type="button" class="btn danger" id="fDelete">Delete</button>
        <button type="submit" class="btn primary wide">Save <span aria-hidden="true">→</span></button>
      </div>
    </form>
  </dialog>

  <!-- Kill list: client priorities, highest first -->
  <dialog id="kill" class="sheet kill">
    <div class="kill-body">
      <div class="sheet-head">
        <h2>Kill list</h2>
        <button type="button" class="icon-btn" data-close-kill aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>

      <form class="kill-form" id="killForm" autocomplete="off">
        <div class="kill-row kill-row-top">
          <label class="field kf-client"><span>Client</span>
            <div class="select-wrap"><select id="kClient"></select></div>
          </label>
          <label class="field kf-due"><span>Due</span><input type="date" id="kDue"></label>
          <label class="field kf-pri"><span>Priority</span>
            <div class="select-wrap"><select id="kPri"></select></div>
          </label>
        </div>
        <div class="kill-new-client" id="kNewClient" hidden>
          <input id="kClientName" placeholder="New client name" maxlength="40" aria-label="New client name">
          <button type="button" class="btn sm" id="kClientCancel">Cancel</button>
          <button type="button" class="btn sm primary" id="kClientAdd">Add client</button>
        </div>
        <div class="kill-row">
          <label class="field kf-task"><span>Task</span><input id="kTask" placeholder="What needs killing?" maxlength="200" required></label>
          <button type="submit" class="btn primary kf-add">Add <span aria-hidden="true">→</span></button>
        </div>
      </form>

      <div class="kill-filter" id="killFilter"></div>
      <ul class="kill-list" id="killList"></ul>
    </div>
  </dialog>

  <!-- Asked when a kill-list task is ticked -->
  <dialog id="killAsk" class="sheet sheet-sm">
    <form method="dialog" class="ask">
      <h2>Task done?</h2>
      <p id="killAskText"></p>
      <div class="ask-btns">
        <button type="button" data-kill-ask="keep" class="btn">Keep it</button>
        <button type="button" data-kill-ask="delete" class="btn primary btn-kill">Delete</button>
      </div>
    </form>
  </dialog>

  <!-- World clock: your time plus zones to compare -->
  <dialog id="clocks" class="sheet clocks">
    <div class="clocks-body">
      <div class="sheet-head">
        <h2>Time zones</h2>
        <button type="button" class="icon-btn" data-close-clocks aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>

      <section class="my-time">
        <span class="my-label" id="myZone"></span>
        <span class="my-clock" id="myClock"></span>
        <span class="my-date" id="myDate"></span>
      </section>

      <div class="compare">
        <span class="compare-label">Compare at</span>
        <input type="date" id="cmpDate" aria-label="Compare date">
        <input type="time" id="cmpTime" aria-label="Compare time" step="900">
        <button type="button" class="btn sm" id="cmpNow">Now</button>
      </div>

      <ul class="clock-list" id="clockList"></ul>

      <div class="clock-add">
        <input type="search" id="clockSearch" placeholder="Add a time zone: city, region or GMT+4…" autocomplete="off" spellcheck="false" aria-label="Add a time zone">
        <ul class="clock-results" id="clockResults" hidden></ul>
      </div>
    </div>
  </dialog>

  <!-- Asked when a repeating task is dragged -->
  <dialog id="scopeAsk" class="sheet sheet-sm">
    <form method="dialog" class="ask">
      <h2 id="scopeTitle">Move repeating task</h2>
      <p id="scopeText"></p>
      <div class="ask-btns">
        <button type="button" data-scope="one" class="btn">Just this event</button>
        <button type="button" data-scope="all" class="btn primary">All events</button>
      </div>
      <button type="button" data-scope="" class="link-btn">Cancel</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
